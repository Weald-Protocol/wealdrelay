# DigitalOcean App Platform. specs/backend/relay/deployment.md path 1.
#
# DigitalOcean's own managed Postgres and DigitalOcean Spaces, not containers of
# ours, so backups and durability stay the provider's job.
#
#   doctl apps create --spec digitalocean-app.yaml
#
# The Spaces keys are the one thing this spec cannot fill in: App Platform has no
# binding that mints them. Create a Spaces access key and set the two SECRET
# values before applying, or set WEALD_RELAY_STORAGE_URL to a file:// path on an
# attached volume instead.
#
# Status: the image below is published from the first signed release onwards and
# not before. Until then, build it yourself with scripts/relay-reproduce.sh and
# push it somewhere App Platform can pull from.

name: weald-relay
region: nyc

services:
  - name: relay
    instance_size_slug: basic-xxs
    instance_count: 1
    http_port: 8443
    image:
      registry_type: GHCR
      registry: hunterh37
      repository: weald-relay
      # RELEASE PIN. The one line in this file to update per release. It is a
      # release tag and never `latest`: the release workflow publishes no moving
      # tag, so `latest` would 404. Swap `tag:` for `digest: sha256:...` once you
      # have verified the digest from the release notes.
      tag: wealdrelay-v0.1.0
    health_check:
      http_path: /healthz
      initial_delay_seconds: 10
      period_seconds: 15
    envs:
      - key: WEALD_RELAY_HOSTNAME
        scope: RUN_TIME
        value: ${APP_DOMAIN}
      - key: WEALD_RELAY_DATABASE_URL
        scope: RUN_TIME
        value: ${weald-relay-db.DATABASE_URL}
      - key: WEALD_RELAY_STORAGE_URL
        scope: RUN_TIME
        value: s3://weald-blobs
      - key: AWS_ENDPOINT_URL_S3
        scope: RUN_TIME
        value: https://nyc3.digitaloceanspaces.com
      - key: AWS_REGION
        scope: RUN_TIME
        value: nyc3
      # Both of the next two values must be replaced before this spec is
      # applied. They are not placeholders App Platform will fill in and they
      # are not optional: applied as written, the relay comes up and then fails
      # every blob write against Spaces with a 403. Create a Spaces access key
      # in the DigitalOcean console and paste the pair in, or drop both keys and
      # point WEALD_RELAY_STORAGE_URL at a file:// path on an attached volume.
      - key: AWS_ACCESS_KEY_ID
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_WITH_A_SPACES_KEY
      - key: AWS_SECRET_ACCESS_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_WITH_A_SPACES_SECRET
      # App Platform terminates TLS on the app domain.
      - key: WEALD_RELAY_TLS
        scope: RUN_TIME
        value: "off"
      - key: WEALD_RELAY_LISTEN
        scope: RUN_TIME
        value: 0.0.0.0:8443
      - key: WEALD_RELAY_OBSERVABILITY_LISTEN
        scope: RUN_TIME
        value: 127.0.0.1:9090
      # Never weakened by a template.
      - key: WEALD_RELAY_ACCESS_SET
        scope: RUN_TIME
        value: enforce

databases:
  - name: weald-relay-db
    engine: PG
    version: "16"
    production: false
