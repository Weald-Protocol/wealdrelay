# Path 4: private network, no public ingress.
# specs/backend/relay/deployment.md path 4.
#
# An overlay on the compose bundle, not a replacement for it:
#
#   docker compose -f ../compose/docker-compose.yml \
#                  -f docker-compose.tailscale.yml up -d
#
# What it changes. Caddy is removed, because there is no ACME without public
# ingress and nothing to terminate on the internet side. A Tailscale sidecar
# joins the tailnet and the relay shares its network namespace, so the relay is
# reachable at the tailnet name and at no other address. Nothing is published to
# the host.
#
# The relay itself is unchanged: same image, same digest, same binary. This is
# configuration, which is the rule the whole audit claim rests on.

services:
  # `scale: 0` rather than deleting the service, because compose overlays merge
  # and cannot remove. Caddy has no work to do here.
  caddy:
    deploy:
      replicas: 0
    ports: []

  tailscale:
    image: tailscale/tailscale:stable@sha256:cdf5612ded5be1344f1a704b8c5e53496db97376bb533e5e15f141e48bf60cc0
    hostname: ${TS_HOSTNAME:-weald-relay}
    restart: unless-stopped
    environment:
      # An ephemeral, pre-authorised auth key from the tailnet admin console.
      # Not a relay secret: it authorises a machine to join a network and grants
      # no access to any envelope.
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY in .env}
      TS_STATE_DIR: /var/lib/tailscale
      # Tailscale's own certificate for the tailnet name, so clients get real
      # TLS without a public CA and without a private CA to distribute.
      TS_SERVE_CONFIG: /config/serve.json
      TS_EXTRA_ARGS: --advertise-tags=tag:weald-relay
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    networks: [weald]

  relay:
    depends_on:
      tailscale:
        condition: service_started
    # The relay has no network identity of its own on this path. It is reachable
    # only through the tailnet, at the sidecar's name.
    network_mode: service:tailscale
    environment:
      WEALD_RELAY_HOSTNAME: ${TS_HOSTNAME:-weald-relay}.${TS_TAILNET:?set TS_TAILNET in .env}
      # Tailscale terminates TLS in the sidecar via serve.json.
      WEALD_RELAY_TLS: "off"
      WEALD_RELAY_LISTEN: 127.0.0.1:8443
      WEALD_RELAY_OBSERVABILITY_LISTEN: 127.0.0.1:9090
      # Still enforce by default. This is the one deployment where `off` is
      # defensible, because the network is doing the perimeter work, but it is
      # the operator's decision to make and every client's encryption panel will
      # show it (specs/backend/relay/deployment.md path 4).
      WEALD_RELAY_ACCESS_SET: ${WEALD_RELAY_ACCESS_SET:-enforce}

volumes:
  tailscale-state:
