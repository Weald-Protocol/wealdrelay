# documentation: https://getweald.com/docs/self-hosting
# slogan: End-to-end encrypted relay for a Weald workspace. Holds no key.
# tags: chat,collaboration,encryption,developer-tools
# logo: svgs/wealdrelay.svg
# port: 8443
#
# The Weald relay as a Coolify service. Coolify's own Traefik or Caddy is in
# front, so this file has no TLS terminator of its own and publishes no host
# port. Coolify fills SERVICE_FQDN_RELAY and generates the passwords from the
# SERVICE_PASSWORD names below.
#
# The relay is blind (specs/backend/relay/groups.md). No password here protects
# anything we could read.

name: weald-relay

services:
  postgres:
    image: postgres:16-bookworm@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55
    restart: unless-stopped
    environment:
      POSTGRES_USER: wealdrelay
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: wealdrelay
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wealdrelay -d wealdrelay"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-wealdrelay}
      MINIO_ROOT_PASSWORD: ${SERVICE_PASSWORD_MINIO}
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 30

  # One shot. The relay never creates buckets: a process that can create one is a
  # process holding a credential that can delete one.
  minio-init:
    image: minio/mc:latest@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing local/"$$BUCKET"
        mc anonymous set none local/"$$BUCKET"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-wealdrelay}
      MINIO_ROOT_PASSWORD: ${SERVICE_PASSWORD_MINIO}
      BUCKET: ${MINIO_BUCKET:-weald-blobs}
    restart: "no"

  relay:
    image: ${WEALD_RELAY_IMAGE:-ghcr.io/weald-protocol/wealdrelay:wealdrelay-v0.1.28}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      WEALD_RELAY_HOSTNAME: ${SERVICE_FQDN_RELAY_8443}
      WEALD_RELAY_DATABASE_URL: postgres://wealdrelay:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/wealdrelay
      WEALD_RELAY_STORAGE_URL: s3://${MINIO_BUCKET:-weald-blobs}
      WEALD_RELAY_TLS: "off"
      WEALD_RELAY_LISTEN: 0.0.0.0:8443
      WEALD_RELAY_TRUSTED_PROXY_HOPS: "1"
      WEALD_RELAY_OBSERVABILITY_LISTEN: 0.0.0.0:9090
      WEALD_RELAY_ACCESS_SET: enforce
      AWS_ENDPOINT_URL_S3: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-wealdrelay}
      AWS_SECRET_ACCESS_KEY: ${SERVICE_PASSWORD_MINIO}
      AWS_REGION: us-east-1
    # No published port. Coolify's proxy reaches 8443 on the internal network,
    # and 9090 is never reachable from off the machine
    # (specs/backend/relay/server.md).
    expose:
      - "8443"

volumes:
  postgres:
  minio:
