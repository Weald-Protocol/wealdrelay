# The Weald relay as an Umbrel app.
#
# Umbrel's app_proxy fronts every app, so there is no TLS terminator and no
# published port here. An Umbrel box is usually behind a home router, which means
# the relay is reachable from the LAN or over Tailscale rather than from the
# internet: that is deployment path 4, private network, and it is a supported
# shape (specs/backend/relay/deployment.md).
#
# $APP_PASSWORD and $APP_DOMAIN come from Umbrel. The relay is blind
# (specs/backend/relay/groups.md), so no password here protects anything we
# could read.

services:
  # No image on purpose: Umbrel injects its own proxy here, so plain
  # `docker compose config` rejects this file and Umbrel does not. Validate the
  # other three artifacts with compose and this one against Umbrel.
  app_proxy:
    environment:
      APP_HOST: weald-relay_relay_1
      APP_PORT: 8443

  postgres:
    image: postgres:16-bookworm@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55
    restart: unless-stopped
    environment:
      POSTGRES_USER: wealdrelay
      POSTGRES_PASSWORD: ${APP_PASSWORD}
      POSTGRES_DB: wealdrelay
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wealdrelay -d wealdrelay"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio:
    image: docker.io/pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-wealdrelay}
      MINIO_ROOT_PASSWORD: ${APP_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 30

  # One shot. The relay never creates buckets: a process that can create one is a
  # process holding a credential that can delete one.
  minio-init:
    image: docker.io/pgsty/mc@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing local/"$$BUCKET"
        mc anonymous set none local/"$$BUCKET"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-wealdrelay}
      MINIO_ROOT_PASSWORD: ${APP_PASSWORD}
      BUCKET: ${MINIO_BUCKET:-weald-blobs}
    restart: "no"

  relay:
    image: ${WEALD_RELAY_IMAGE:-ghcr.io/weald-protocol/wealdrelay:wealdrelay-v0.1.28}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      WEALD_RELAY_HOSTNAME: ${APP_DOMAIN}
      WEALD_RELAY_DATABASE_URL: postgres://wealdrelay:${APP_PASSWORD}@postgres:5432/wealdrelay
      WEALD_RELAY_STORAGE_URL: s3://${MINIO_BUCKET:-weald-blobs}
      WEALD_RELAY_TLS: "off"
      WEALD_RELAY_LISTEN: 0.0.0.0:8443
      WEALD_RELAY_TRUSTED_PROXY_HOPS: "1"
      WEALD_RELAY_OBSERVABILITY_LISTEN: 0.0.0.0:9090
      WEALD_RELAY_ACCESS_SET: enforce
      AWS_ENDPOINT_URL_S3: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-wealdrelay}
      AWS_SECRET_ACCESS_KEY: ${APP_PASSWORD}
      AWS_REGION: us-east-1
    # No published port: app_proxy reaches 8443 on the app network, and 9090 is
    # never reachable from off the box (specs/backend/relay/server.md).

