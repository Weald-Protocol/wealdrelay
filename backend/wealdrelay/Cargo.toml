[package]
name = "wealdrelay"
version = "0.1.44"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The Weald blind relay. Stores and forwards envelopes it cannot read."

[lib]
name = "wealdrelay"
path = "src/lib.rs"

[[bin]]
name = "wealdrelay"
path = "src/main.rs"

[dependencies]
# The runtime. One process, no sidecars (specs/backend/relay/server.md).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "fs", "sync"] }
# HTTP for the two health surfaces. Two listeners, because detailed readiness is
# private and public /healthz says nothing but "alive".
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio", "ws", "query"] }
# Postgres. No compile-time database connection: the `migrate!` macro embeds the
# migration files, which is what makes "migrations from zero" a property of the
# binary rather than of a deploy script.
# `time` is here for one reason: a timestamp read as a plain column rather than as
# a SQL-computed boolean. `(completed_at is not null) as completed` cannot fail to
# decode, because Postgres guarantees the type of its own expression, so the error
# arm on that read is unreachable and untestable. Reading the column itself has a
# failure a test can actually produce (a retyped column), which is the difference
# between a handled database fault and one nobody has ever run.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "migrate", "macros", "uuid", "time"] }
# Reservation and multipart session identifiers for media blobs.
uuid = { version = "1", features = ["v4"] }
# S3, for the object storage backend that is not the filesystem.
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "rustls"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "rustls"] }
aws-credential-types = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
# Structured JSON logs, with the scrubbing layer on top of them.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "env-filter", "registry"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
url = "2"
# The envelope content address. The client computes the same value over the same
# canonical encoding with the BLAKE3 team's own C at tag 1.5.4.
blake3 = "1"
ed25519-dalek = { version = "3.0.0", default-features = false }
# Argon2id for the one-time invite code. Memory-hard on purpose: the relay holds a
# hash of a 60-bit value so it can rate-limit attempts without learning the code,
# and a fast hash of 60 bits is a hash an attacker with the record brute forces
# offline (specs/backend/relay/invites.md).
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
getrandom = "0.4.3"
# The outbound wake POST. Already in this tree transitively under axum and the AWS
# SDK, so this takes no new third party: hyper plus a rustls connector is the
# client the crate already links.
hyper = { version = "1", default-features = false, features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "http1", "http2", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "webpki-roots", "tls12"] }
http-body-util = "0.1"
# Named directly for one reason: the crypto provider is passed to the connector
# explicitly rather than taken from the process-wide default. Two providers are
# reachable in this dependency graph, and `ClientConfig::builder()` panics when it
# cannot pick one, which would be a panic on the wake path of a relay that started
# fine. Already in the tree under sqlx's `tls-rustls-ring`.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# Three of the four primitives the sealed bootstrap handoff needs: HKDF-SHA256,
# AES-256-GCM and SHA-256 (`src/invite/handoff.rs`). Already linked into this
# binary underneath rustls and sqlx, so naming it directly adds a line here and no
# code to the dependency graph. The fourth, X25519, is below and says why.
ring = "0.17"
# X25519 with a *static* private key, which `ring` deliberately does not offer:
# its agreement API consumes an ephemeral key it generated itself. Sealing only
# ever needs the ephemeral direction, but the conformance vectors in
# specs/backend/contracts/wire/vectors/bootstrap-handoff.json pin a specific
# ephemeral private key precisely so both implementations can be checked against
# the same bytes, and a construction no test can reproduce deterministically is a
# construction checked against nothing. Same family as `ed25519-dalek`, already in
# the tree: this adds `x25519-dalek` over a `curve25519-dalek` that is already
# linked.
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
# The export artifact (`src/backup.rs`, `specs/backend/relay/operations.md`). Two
# new third parties, and the smallest pair that produce the format the artifact
# names, `<name>.tar.gz`: `tar` writes ustar headers and `flate2` on its
# pure-Rust backend does the gzip, so neither adds a C toolchain to a build that
# has none. Writing a tar by hand was the alternative and was rejected: a
# hand-rolled archiver is a format nobody else's tooling can be held to, and the
# one thing a disaster-recovery artifact must be is readable by tools the
# operator already has.
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
# Reading back what `src/backup.rs` wrote. An integration test is its own crate,
# so the two archive crates are named again here rather than inherited; no new
# third party either way.
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
proptest = "1"
tempfile = "3"
# Only for sending a real SIGTERM to a spawned relay in tests/process.rs.
libc = "0.2"
# Only for driving the router directly in tests/health.rs, so a route can be
# asserted without binding a port. Already in the tree underneath axum.
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
