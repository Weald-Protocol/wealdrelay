# The local harness, per specs/backend/build/local-harness.md.
#
# Everything here is real. Postgres, object storage, Redis and TLS-less sockets
# are the same components the customer runs; only the infrastructure provider,
# payments and mail delivery are faked, and those three are faked outside this
# file (FakeProvisioner, Stripe test mode, and Mailpit, which speaks real SMTP
# to a local inbox).
#
# Base images are pinned by digest, never by tag, per
# specs/backend/build/environments.md. A digest change is a deliberate commit.

name: weald-stack

services:
  postgres:
    image: postgres@sha256:74e110c41804365e3915fcc09d5e7a1eff50161aaa94d5da0e58e0cd75ae509c
    environment:
      POSTGRES_USER: weald
      POSTGRES_PASSWORD: weald
      # One database per relay instance is created by the relay's migrations;
      # this is the bootstrap database the harness connects to.
      POSTGRES_DB: weald_relay
      # Fast and unsafe on purpose: this volume is disposable, and fsync on a
      # laptop is most of the cold-start budget the 90 second gate has to fit in.
      POSTGRES_INITDB_ARGS: "--nosync"
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
    ports:
      - "${WEALD_STACK_PG_PORT:-54032}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weald -d weald_relay"]
      interval: 1s
      timeout: 3s
      retries: 40
      start_period: 2s

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: weald
      MINIO_ROOT_PASSWORD: weald-local-only
      MINIO_UPDATE: "off"
    ports:
      - "${WEALD_STACK_MINIO_PORT:-54090}:9000"
      - "${WEALD_STACK_MINIO_CONSOLE_PORT:-54091}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 1s
      timeout: 3s
      retries: 40
      start_period: 2s

  redis:
    image: redis@sha256:595cc6f2bb3af6e03347b90deb6123c6aa2c81dea05ce08128de8a174b6ac67b
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${WEALD_STACK_REDIS_PORT:-54079}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 40

  mailpit:
    image: axllent/mailpit@sha256:7f33095f80e901f6ad08028f06ca284aa58fe84942be5496008d041d3b9f4d4d
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "${WEALD_STACK_SMTP_PORT:-54025}:1025"
      - "${WEALD_STACK_MAILPIT_UI_PORT:-54080}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 1s
      timeout: 3s
      retries: 40

volumes:
  postgres-data:
  minio-data:
