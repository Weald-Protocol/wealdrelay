# Security reports do not come through the issue tracker. The link below is the
# first thing somebody sees when they click New issue, which is the point.
blank_issues_enabled: true
contact_links:
  - name: Security report
    url: https://github.com/Weald-Protocol/wealdrelay/blob/main/SECURITY.md
    about: >-
      Do not open an issue. security@weald.team, and please give us a chance to
      ship a fix before publishing. Cryptographic and protocol design objections
      are in scope even without an exploit.
