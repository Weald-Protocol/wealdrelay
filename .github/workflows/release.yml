# Release: everything the public repository can prove on its own.
#
# The relay's full gate (coverage floors, property suites, miri, fuzz, the
# negative proofs, and the app-side integration steps) runs in Weald's private
# build repository, because most of it exercises surfaces that are not here.
# What IS here is the part a third party needs in order to disbelieve us: the
# test suite against a real Postgres, two independent runners producing
# byte-identical images, a clean clone of the tag producing the same digest a
# third time, and a cosign signature over the result.
#
# Nothing below takes a secret. `GITHUB_TOKEN` pushes to this repository's own
# package namespace and cosign signs keylessly against the Actions OIDC issuer,
# which is what makes the signature checkable by someone with no relationship to
# us.

name: release

on:
  push:
    tags:
      - "wealdrelay-v*"
  workflow_dispatch:

jobs:
  test:
    name: build and test
    runs-on: ubuntu-24.04
    # Two cancelled releases wrote this comment, and the second one changed the
    # answer the first one gave.
    #
    # v0.1.0 died at 90 minutes with the suite still passing, and the obvious
    # reading was "these property tests are expensive, give them room". v0.1.1
    # died at 180 with one test, `no_sequence_of_frames_panics_or_reopens_a_
    # closed_session`, having run for two hours and nineteen minutes without
    # finishing. That is not expensive, it is a different regime: the same test
    # at the same 512 cases takes 57 seconds on a developer machine, and the
    # whole binary takes 60. Simple tests beside it were reporting "running for
    # over 60 seconds" on the runner. The suite opens real sockets against a
    # real Postgres in docker, and a two-core hosted runner does not have the io
    # to do that at this depth; the multiple is not 3x, it is somewhere past
    # 100x and it did not terminate.
    #
    # So the case count is stated here rather than defaulted. `PROPTEST_CASES`
    # is read by the suites for exactly this reason and their own comment
    # anticipates it. 64 cases of a frame-sequence property on every release,
    # 512 in the private nightly, and this comment rather than a silent default
    # is what keeps the difference visible. What a third party can still do with
    # this workflow is unchanged in kind: the tests run against a real Postgres
    # over real sockets, the two reproducible builds and the clean-clone rebuild
    # are untouched, and the digest they agree on is a property of the source
    # rather than of how many property cases ran.
    # Raised from 180 with the oversubscription below, because the cancellation
    # it caused published nothing at all: the ceiling is the last line of
    # defence and it should not be the thing the suite is racing.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml is the pin and has to be the pin here too.
      # `dtolnay/rust-toolchain@stable` exports RUSTUP_TOOLCHAIN=stable, which
      # overrides the file, so the channel is read from the file rather than
      # written twice and allowed to drift.
      - id: pin
        run: sed -n 's/^channel = "\(.*\)"/channel=\1/p' rust-toolchain.toml >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
          components: rustfmt, clippy
      # The same command a contributor runs, rather than a set of service
      # containers that resemble it. The integration tiers hard-code the
      # harness's ports and credentials on purpose, so a CI database on some
      # other port and password is a database the suites refuse to talk to, and
      # they fail rather than skipping.
      - run: scripts/weald-stack up --budget 240
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Strict, and with the CDDL tool actually installed. A release whose schema
      # check silently skipped is a release that published an unchecked schema.
      - env:
          WEALD_SPEC_CHECK_STRICT: "1"
        run: |
          set -eux
          cargo install cddl --locked --quiet
          ./scripts/spec-check.sh
      # `RUST_TEST_THREADS` because these suites are bound by Postgres round
      # trips and by relay deadlines, not by CPU: a test waiting on a 5 second
      # handshake deadline occupies a core it is not using. The default is the
      # runner's core count, which is how `build and test` grew to 2h50m57s on
      # wealdrelay-v0.1.33 and was cancelled against this job's ceiling on
      # v0.1.35 while `tests/session.rs` alone cost 3434 s here against 17 s on
      # a developer machine running the same commands. Eight is the same
      # oversubscription a laptop gets for free.
      - env:
          PROPTEST_CASES: "64"
          RUST_TEST_THREADS: "8"
        run: cargo test --workspace --locked
      - if: always()
        run: scripts/weald-stack down

  # Two independent runners must produce byte-identical artifacts. `fetch-depth:
  # 0` is load-bearing: relay-reproduce.sh takes SOURCE_DATE_EPOCH from the
  # tagged commit's own timestamp, and a shallow clone has no commit to take it
  # from.
  #
  # Both runners are native arm64, and that is a change. They used to differ in
  # host architecture as well as identity, which is the stronger claim, and the
  # x86_64 half of it built the pinned arm64 builder under QEMU: 10776 seconds
  # against 557 native. Downstream of a test job that costs most of two hours,
  # that put three hours of emulation on the critical path of every release, and
  # wealdrelay-v0.1.25 was cancelled at 5h59m28s against GitHub's six hour
  # ceiling with no image published at all. v0.1.24 had finished in 4h18m26s, so
  # the budget was spent before that tag added anything.
  #
  # The cross-architecture claim is not dropped, it is moved. `cross-host` below
  # runs the same build on an x86_64 host on every tag, starts at the same
  # moment this job's dependency does rather than after it, and must agree with
  # the digest these two settle on. What it no longer does is stand between the
  # source and the push. A digest is not pinned in production until that job is
  # green (scripts/relay-crosshost-check.sh in Weald's build repository), so the
  # emulated proof still gates what anybody runs; it stops gating whether the
  # release can finish inside a job's lifetime.
  reproducible:
    name: reproducible build, runner ${{ matrix.runner }}
    needs: test
    runs-on: ${{ matrix.os }}
    # 60, against a measured 557 seconds on a native arm64 host. The old 330 was
    # sized for the emulated build, which no longer runs here.
    #
    # The two manifests from the emulated pair agreed exactly, which is what
    # makes moving it defensible rather than convenient:
    #   both hosts  artifact sha256:cc1b7e7c5c05ecfc394a52df32c951487454d55e...
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - runner: a
            os: ubuntu-24.04-arm
          - runner: b
            os: ubuntu-24.04-arm
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build and record the digest
        env:
          WEALD_REPRO_LABEL: ${{ matrix.runner }}
          # Stated rather than derived. The OCI version label is a digest input,
          # so all three builds have to agree on it, and `git describe` agreeing
          # by luck is not the same as every job being handed the same string.
          WEALD_REPRO_VERSION: ${{ github.ref_name }}
        run: scripts/relay-reproduce.sh --out repro-${{ matrix.runner }} --label ${{ matrix.runner }}
      # `always()`, learned from v0.1.3: the build sends its output to build.log,
      # so uploading only on success throws away the one log worth reading.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repro-${{ matrix.runner }}-${{ github.ref_name }}
          # The image tar is hundreds of megabytes and is not the evidence. The
          # manifest is.
          path: |
            repro-${{ matrix.runner }}/manifest.json
            repro-${{ matrix.runner }}/build.log
          if-no-files-found: warn

  # The cross-architecture reproduction, off the critical path and on every tag.
  #
  # Same script, same environment, x86_64 host: the Dockerfile's builder is
  # pinned to linux/arm64, so this one runs the toolchain under QEMU and takes
  # about three hours. `needs:` is deliberately absent. This job starts the
  # moment the tag is pushed, in parallel with `test`, so its three hours run
  # beside the release rather than after it. It fails on its own without taking
  # the release with it, and `cross-host-agrees` records the verdict.
  #
  # A build that failed the tests is a build nobody publishes, so three hours
  # spent on one is wasted. It is spent anyway: hosted runners are free to this
  # repository, and serialising behind `test` is the whole defect this job
  # exists to undo.
  cross-host:
    name: cross-architecture reproduction, x86_64 host under emulation
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.repro.outputs.digest }}
    # 330: twice the measured 10776 seconds (179.6 minutes), which leaves room
    # for a slower runner without letting a hung build reach the six hour
    # ceiling.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # The digest leaves this job as a job output as well as an artifact.
      # wealdrelay-v0.1.38 spent 2h48m on this build and then lost the verdict
      # to an upload-artifact CreateArtifact timeout, which left the pin gate
      # unproven for a defect that was not in the image. A job output is carried
      # by the run itself and cannot time out.
      - name: Build and record the digest
        id: repro
        env:
          WEALD_REPRO_LABEL: cross-host
          WEALD_REPRO_VERSION: ${{ github.ref_name }}
        run: |
          set -eux
          scripts/relay-reproduce.sh --out repro-cross-host --label cross-host
          digest="$(python3 -c 'import json;print(json.load(open("repro-cross-host/manifest.json"))["artifact_digest"])')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      # Advisory: the build log is worth keeping, but the verdict no longer
      # depends on it, so a CreateArtifact timeout must not red this job.
      - if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: crossarch-${{ github.ref_name }}
          path: |
            repro-cross-host/manifest.json
            repro-cross-host/build.log
          if-no-files-found: warn

  # The verdict of the cross-architecture build, as its own job so that a reader
  # of the run, and scripts/relay-crosshost-check.sh in Weald's build
  # repository, can ask one name whether the claim holds. Nothing downstream
  # needs it: it gates the pin, not the push.
  cross-host-agrees:
    name: the x86_64 host agrees with the digest that was published
    needs: [cross-host, compare]
    runs-on: ubuntu-24.04
    steps:
      - name: It must equal the digest the two arm64 runners agreed on
        run: |
          set -eux
          rebuilt='${{ needs.cross-host.outputs.digest }}'
          agreed='${{ needs.compare.outputs.digest }}'
          test -n "$rebuilt"
          {
            echo "### reproducibility, second architecture"
            echo
            echo "| build | digest |"
            echo "| --- | --- |"
            echo "| agreed by runners a and b (arm64 hosts) | ${agreed} |"
            echo "| x86_64 host, builder emulated | ${rebuilt} |"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$rebuilt" = "$agreed"

  compare:
    name: the digests must match
    needs: reproducible
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.compare.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: repro-*-${{ github.ref_name }}
          path: repro
      - name: Compare
        id: compare
        run: |
          set -eux
          python3 scripts/repro-compare.py repro --out agreed-digest.txt
          echo "digest=$(cat agreed-digest.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: agreed-digest-${{ github.ref_name }}
          path: agreed-digest.txt

  # The raw binary, for `deploy/systemd` and for the Homebrew formula, which
  # points at these artifacts rather than at a bottle so that what Homebrew
  # installs is byte-identical to what the release notes name.
  #
  # Each target builds natively. Cross-compiling to musl through a container adds
  # a second toolchain nobody audits, and the two architectures already have
  # runners.
  #
  # `x86_64-pc-windows-msvc` is named in specs/backend/relay/server.md and is not
  # built here yet. When it is, it joins this matrix rather than shipping from
  # somebody's laptop.
  binaries:
    name: ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pin
        run: sed -n 's/^channel = "\(.*\)"/channel=\1/p' rust-toolchain.toml >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
          targets: ${{ matrix.target }}
      # blake3, ring and rusqlite compile C, so a musl target needs a musl C
      # compiler. Native on each runner: no sysroot, no linker wrapper.
      - if: runner.os == 'Linux'
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      # BSD tar and BSD touch cannot pin sort order or an epoch mtime, and both
      # are what makes the archive's checksum a property of the tag rather than
      # of the runner's clock. The GNU pair does the same thing on both runners.
      - if: runner.os == 'macOS'
        run: brew install gnu-tar coreutils
      - name: Build
        env:
          # Timestamps in the archive come from the tagged commit, not the
          # runner's clock, so the checksum is a property of the tag.
          CARGO_TERM_COLOR: never
        run: |
          set -eux
          cargo build --release --locked -p wealdrelay --target ${{ matrix.target }}
          ./target/${{ matrix.target }}/release/wealdrelay --version
      - name: Pack, deterministically
        run: |
          set -eux
          name="wealdrelay-${{ matrix.target }}"
          staging="$name"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/wealdrelay" "$staging/"
          cp backend/wealdrelay/LICENSE backend/wealdrelay/NOTICE "$staging/"
          tar=tar; touch=touch
          if [ "$RUNNER_OS" = macOS ]; then tar=gtar; touch=gtouch; fi
          epoch="$(git log -1 --pretty=%ct)"
          find "$staging" -exec "$touch" -d "@$epoch" {} +
          "$tar" --sort=name --owner=0 --group=0 --numeric-owner \
              --mtime="@$epoch" -czf "$name.tar.gz" "$staging"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$name.tar.gz" | tee "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" | tee "$name.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}-${{ github.ref_name }}
          path: |
            wealdrelay-${{ matrix.target }}.tar.gz
            wealdrelay-${{ matrix.target }}.tar.gz.sha256

  # The compose bundle a self-hoster downloads, with the checksum
  # deploy/install.sh refuses to install without.
  bundle:
    name: the compose bundle
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pack
        run: |
          set -eux
          staging=weald-relay
          mkdir -p "$staging"
          cp backend/wealdrelay/deploy/compose/docker-compose.yml \
             backend/wealdrelay/deploy/compose/Caddyfile \
             backend/wealdrelay/deploy/compose/.env.example \
             backend/wealdrelay/deploy/compose/README.md \
             "$staging/"
          # install.sh goes in the bundle and is attached to the release beside
          # it. It is the only thing that generates the two passwords, and until
          # it shipped here the compose README's first command was the one route
          # to it, over a hostname that does not resolve.
          install -m 0755 backend/wealdrelay/deploy/install.sh "$staging/install.sh"
          # Deterministic: sorted, no owner, and mtimes from the tagged commit,
          # so the bundle's checksum is a property of the tag and not of the
          # runner's clock.
          epoch="$(git log -1 --pretty=%ct)"
          find "$staging" -exec touch -d "@$epoch" {} +
          tar --sort=name --owner=0 --group=0 --numeric-owner \
              --mtime="@$epoch" -czf weald-relay-compose.tar.gz "$staging"
          sha256sum weald-relay-compose.tar.gz | tee weald-relay-compose.tar.gz.sha256
          cp backend/wealdrelay/deploy/install.sh install.sh
          sha256sum install.sh | tee install.sh.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: compose-bundle-${{ github.ref_name }}
          path: |
            weald-relay-compose.tar.gz
            weald-relay-compose.tar.gz.sha256
            install.sh
            install.sh.sha256

  # Deliberately downstream of `compare`: an image is published only after two
  # runners have agreed on the build. Publishing first and verifying afterwards
  # would put an unverified digest in front of a self-hoster, which is the
  # ordering the reproducibility proof exists to prevent.
  image:
    name: publish the image
    needs: [compare, bundle]
    # arm64, and not for speed alone. The Dockerfile's builder is pinned to
    # linux/arm64 so that the toolchain cannot vary with the host, which makes
    # this build native here and a three hour QEMU crawl on an x86_64 runner.
    # The digest it pushes is the one the `reproducible` matrix already agreed
    # on across both architectures, so nothing about the claim depends on which
    # machine performs the push.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve SOURCE_DATE_EPOCH from the tagged commit
        id: epoch
        run: echo "value=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push, amd64 and arm64
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/wealdrelay/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # No moving tag. A `:latest` that changed under a self-hoster without
          # a deploy they asked for is exactly the failure digest pinning
          # exists to prevent, so it is never published.
          # Written out rather than derived from `github.repository_owner`.
          # The owner is `Weald-Protocol` and a registry path must be lowercase,
          # so the derived form would have failed the push on the first release
          # and only on the first release. The name is settled in
          # specs/backend/build/container-image.md and it is pinned here.
          tags: |
            ghcr.io/weald-protocol/wealdrelay:${{ github.ref_name }}
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.epoch.outputs.value }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.ref_name }}
          provenance: mode=max
          sbom: true
          outputs: type=image,rewrite-timestamp=true
      - uses: sigstore/cosign-installer@v3
      - name: Sign, keylessly
        run: |
          set -eux
          cosign sign --yes \
            "ghcr.io/weald-protocol/wealdrelay@${{ steps.push.outputs.digest }}"

  verify-published:
    name: a clean clone at the tag matches the published digest
    needs: [compare, image]
    # arm64 for the same reason as `image`: the pinned builder is native here.
    # What this job is for is unchanged, and it is not the architecture: a clone
    # made fresh at the tag, on a machine holding none of the pipeline's cache,
    # must rebuild the digest that was actually published.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Clone afresh, at the tag, with nothing else on the machine
        run: git clone --branch "${{ github.ref_name }}" --no-single-branch
             "https://github.com/${{ github.repository }}.git" clean
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Rebuild
        working-directory: clean
        env:
          WEALD_REPRO_LABEL: clean-clone
          WEALD_REPRO_VERSION: ${{ github.ref_name }}
        run: scripts/relay-reproduce.sh --out ../repro-clean --label clean-clone
      # `artifact_digest`, which is the one number relay-reproduce.sh hashes over
      # `platform_digests` plus `binaries`, and the same field repro-compare.py
      # returns as the agreed digest. Reading `platform_digests` here instead
      # would compare a Python dict repr against a `sha256:` string and could
      # never match, which would leave every release blocked on a job that can
      # only fail.
      - name: It must equal the digest the other two agreed on
        run: |
          set -eux
          rebuilt="$(python3 -c 'import json,sys;print(json.load(open("repro-clean/manifest.json"))["artifact_digest"])')"
          agreed='${{ needs.compare.outputs.digest }}'
          {
            echo "### reproducibility, third build"
            echo
            echo "| build | digest |"
            echo "| --- | --- |"
            echo "| agreed by runners a and b | ${agreed} |"
            echo "| clean clone at the tag | ${rebuilt} |"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$rebuilt" = "$agreed"
      - uses: sigstore/cosign-installer@v3
      - name: The published image carries our signature and its provenance
        run: |
          set -eux
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "ghcr.io/weald-protocol/wealdrelay@${{ needs.image.outputs.digest }}" \
            2>&1 | tee cosign-verify.txt
      - uses: actions/upload-artifact@v4
        with:
          name: verify-published-${{ github.ref_name }}
          path: |
            repro-clean/manifest.json
            cosign-verify.txt

  # The release itself, and it is last on purpose. Nothing is downloadable until
  # two runners and a clean clone have agreed on the image digest and the
  # published image has been verified to carry our signature. A release whose
  # assets appeared before the proof did would invite somebody to install the one
  # thing this pipeline exists to check.
  #
  # `install.sh` refuses to install a bundle whose `.sha256` is missing, so every
  # checksum file is attached beside its artifact rather than folded into the
  # notes.
  publish:
    name: the release
    needs: [compare, image, binaries, bundle, verify-published]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # Named patterns rather than everything, and this is not tidiness. v0.1.5
      # failed here twice: `merge-multiple` with no pattern downloads every
      # artifact in the run, which includes the `*.dockerbuild` build record
      # docker/build-push-action uploads by itself, and that one fails to extract
      # after five retries. Six of nine artifacts downloaded, then the job died
      # with the image already pushed and verified.
      #
      # These three are what a release is made of. The reproducible-build
      # manifests and logs stay artifacts: they are evidence about the release,
      # not part of it.
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: binary-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: compose-bundle-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: agreed-digest-*
          merge-multiple: true
      - name: Assemble the notes
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
          AGREED: ${{ needs.compare.outputs.digest }}
        run: |
          set -eux
          ls -l assets
          {
            printf '## Image\n\n'
            printf '```\nghcr.io/weald-protocol/wealdrelay@%s\n```\n\n' "$DIGEST"
            printf 'Pin the digest, not the tag. '
            printf 'Two independent runners and a clean clone of this tag each built it and agreed:\n\n'
            printf '```\n%s\n```\n\n' "$AGREED"
            printf 'Check it yourself, from this tag, with no artifact of ours involved:\n\n'
            printf '```sh\nscripts/relay-reproduce.sh --out ./repro\n```\n\n'
            printf 'Then compare `repro/manifest.json` against the digest above. '
            printf 'The signature is keyless and checkable by anyone:\n\n'
            printf '```sh\ncosign verify \\\n'
            printf '  --certificate-identity-regexp "^https://github.com/%s/" \\\n' "${{ github.repository }}"
            printf '  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\\n'
            printf '  ghcr.io/weald-protocol/wealdrelay@%s\n```\n\n' "$DIGEST"
            printf '## Checksums\n\n'
            printf 'Every asset below is listed with its SHA-256. `install.sh` is '
            printf 'attached beside `install.sh.sha256`: check it before you run it, '
            printf 'because it is the one asset here that executes on your machine.\n\n'
            printf '```\n'
            cat assets/*.sha256
            printf '```\n\n'
            printf 'What this release does and does not prove is set out in '
            printf '`specs/backend/relay/verification.md`.\n'
          } > notes.md
          cat notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file notes.md \
            --verify-tag \
            assets/weald-relay-compose.tar.gz \
            assets/weald-relay-compose.tar.gz.sha256 \
            assets/install.sh \
            assets/install.sh.sha256 \
            assets/wealdrelay-*.tar.gz \
            assets/wealdrelay-*.tar.gz.sha256 \
            assets/agreed-digest.txt
