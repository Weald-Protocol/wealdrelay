# One job, one question: what does the reproducible build do on an arm64 host?
#
# It exists because `wealdrelay-v0.1.3`'s runner b failed inside
# `relay-reproduce.sh` in under a minute and the script sends the build's own
# output to `$OUT/build.log`, which the release workflow only uploads on success.
# Evidence you cannot read is not evidence. This is the same build with the log
# uploaded unconditionally, on demand, without an eighty minute test job in front
# of it.
#
# Deliberately `workflow_dispatch` only, and deliberately not part of any gate.
name: repro-debug

on:
  workflow_dispatch:
    inputs:
      os:
        description: which runner to build on
        default: ubuntu-24.04-arm
        type: choice
        options: [ubuntu-24.04-arm, ubuntu-24.04]

jobs:
  build:
    name: reproducible build on ${{ inputs.os }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: What the host actually has
        run: |
          set -eux
          uname -m
          docker version
          docker buildx version
          df -h /
          ls /proc/sys/fs/binfmt_misc/ || true
      - name: Build
        env:
          WEALD_REPRO_LABEL: debug
          WEALD_REPRO_VERSION: repro-debug
        run: scripts/relay-reproduce.sh --out repro-debug --label debug
      # Unconditional. The failing case is the one whose log is worth having.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repro-debug-${{ inputs.os }}
          path: |
            repro-debug/build.log
            repro-debug/manifest.json
            repro-debug/buildx-metadata.json
          if-no-files-found: warn
