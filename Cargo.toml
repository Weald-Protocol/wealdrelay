[workspace]
resolver = "2"
members = ["backend/wealdrelay", "backend/weald-mls"]

[workspace.package]
edition = "2021"
# Apache 2.0. Verification requires public source, so the relay and the MLS
# binding are the two crates that ship under it. The macOS client is not in this
# workspace and stays proprietary: see LICENSE and the licence note in README.md.
license = "Apache-2.0"
repository = "https://github.com/Weald-Protocol/wealdrelay"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# There is deliberately no `panic` key here. Leaving it at the default `unwind`
# is load bearing: weald-mls wraps every C ABI entry point in `catch_unwind` so a
# panic becomes a status code rather than a dead host process, and panic = "abort"
# would bypass that boundary. See specs/backend/relay/mls-binding.md.
#
# Strip symbols: the release binary is published and independently rebuilt, and
# symbol tables carry build-machine paths that would make two honest builds of
# the same source differ.
strip = true
